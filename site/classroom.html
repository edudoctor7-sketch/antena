<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="안테나랩 AI 웹페이지 전문가 마스터과정 수강생 전용 강의실입니다.">
<meta name="theme-color" content="#0F8B8D">

<style>
:root{--ink:#14151A;--ink2:#3E4046;--gray:#6B6D74;--line:#EBEAE8;--paper:#FFFFFF;--bg:#F7FAF9;--navy:#1B3A5C;--teal:#0F8B8D;--teal-d:#0B6F71;--teal-pale:#E1F5F0;--amber:#E8A838;--amber-pale:#FDF3E0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Nanum Myeongjo','Noto Serif KR',serif;line-height:1.3;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

[hidden]{display:none!important}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#E1F5F0,#fff 60%)}
.gbox{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 26px;text-align:center;box-shadow:0 18px 44px rgba(27,58,92,.12)}
.glogo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--teal);color:#fff;display:grid;place-items:center;font:800 26px 'Nanum Myeongjo',serif}
.gbox h1{font-size:26px;color:var(--navy)}.gbox p{color:var(--ink2);margin:10px 0 20px;font-size:15px}
.gbox input{width:100%;font-size:22px;text-align:center;letter-spacing:4px;padding:14px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
.gbox input:focus{border-color:var(--teal);outline:none}
.gbox button{margin-top:14px;width:100%;background:var(--amber);border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .1s,filter .2s}.gbox button:hover{filter:brightness(.95)}.gbox button:active{transform:scale(.98)}
#gmsg{min-height:24px;margin-top:12px;font-size:14px;color:#B3261E;font-weight:700}
.gbox small{display:block;margin-top:14px;color:var(--gray);font-size:13px}.gbox a{color:var(--teal-d)}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
</style>
</head>

</form>

function initRoom(room){
  var KEY="antena_class_done",done={};
  try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  function paint(){
    var n=0;room.querySelectorAll("input[data-act]").forEach(function(c){
      var on=!!done[c.dataset.act];c.checked=on;if(on)n++;
      var d=c.closest("details");d&&d.classList.toggle("done",on);});
    room.querySelector("#barfill").style.width=(n/8*100)+"%";
    room.querySelector("#progtxt").textContent=n+" / 8 완료";
    room.querySelector(".progress").setAttribute("aria-valuenow",n);
  }
  paint();
  room.addEventListener("change",function(e){var c=e.target;if(c.matches("input[data-act]")){
    if(c.checked)done[c.dataset.act]=1;else delete done[c.dataset.act];
    try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}paint();
    if(c.checked){var nx=room.querySelector("#act"+(+c.dataset.act+1));c.closest("details").open=false;if(nx){nx.open=true;nx.scrollIntoView({behavior:"smooth",block:"start"})}}}});
  room.addEventListener("click",function(e){var b=e.target.closest("[data-copy]");if(!b)return;
    var t=b.closest(".prompt").querySelector("pre").innerText;
    var ok=function(){var o=b.textContent;b.textContent="복사됐어요 ✓";b.classList.add("ok");setTimeout(function(){b.textContent=o;b.classList.remove("ok")},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fallback)}else fallback();
    function fallback(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(ta)}});
  function openHash(){var h=location.hash;if(/^#act\d$/.test(h)){var d=room.querySelector(h);if(d)d.open=true}}
  window.addEventListener("hashchange",openHash);openHash();
  var first=room.querySelector("#act1");if(first&&!/^#act/.test(location.hash))first.open=true;
}
var form=document.getElementById("gform"),inp=document.getElementById("pw"),msg=document.getElementById("gmsg");
function fail(t){msg.textContent=t;var b=document.querySelector(".gbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");inp.select()}
form.addEventListener("submit",async function(e){e.preventDefault();msg.textContent="";
  var v=inp.value.trim(),k=kst();
  if(!v){fail("비밀번호를 입력해 주세요.");return}
  try{var K=await unwrap(v,k.day);try{sessionStorage.setItem("antena_class_k",JSON.stringify({d:k.str,k:u2b(K)}))}catch(e){}await open(K)}
  catch(err){fail("비밀번호가 맞지 않아요. 다시 확인해 주세요.")}});
(async function(){try{var s=JSON.parse(sessionStorage.getItem("antena_class_k")||"null");
  if(s&&s.d===kst().str){await open(b2u(s.k))}}catch(e){}})();
if(!window.crypto||!crypto.subtle){msg.textContent="이 브라우저에서는 열 수 없어요. 크롬 또는 사파리 최신 버전으로 접속해 주세요."}
})();
</script>
</body>
</html>
